# SonarQube Project Configuration
sonar.projectKey=devsecops-pipeline-guardian
sonar.projectName=DevSecOps Pipeline Guardian
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Language configuration
sonar.language=py
sonar.python.version=3.9,3.10,3.11,3.12

# Exclusions
sonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**,**/dist/**,**/build/**

# Test coverage
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/tests/**,**/examples/**

# Security rules
sonar.security.hotspots=CRITICAL,HIGH,MEDIUM,LOW

# Code analysis
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Additional settings
sonar.scm.provider=git
sonar.sourceEncoding=UTF-8
