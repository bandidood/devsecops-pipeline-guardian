version: '3.8'

services:
  # Main Application
  devsecops-guardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsecops-guardian
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/devsecops
      - REDIS_URL=redis://redis:6379/0
      - SONAR_HOST_URL=${SONAR_HOST_URL:-http://sonarqube:9000}
      - SONAR_TOKEN=${SONAR_TOKEN}
      - SNYK_TOKEN=${SNYK_TOKEN}
      - NVD_API_KEY=${NVD_API_KEY}
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - devsecops-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: devsecops-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=devsecops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - devsecops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: devsecops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - devsecops-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SonarQube for SAST
  sonarqube:
    image: sonarqube:community
    container_name: devsecops-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=postgres
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - devsecops-network
    depends_on:
      - postgres

  # OWASP ZAP for DAST
  zap:
    image: owasp/zap2docker-stable
    container_name: devsecops-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=true
    ports:
      - "8090:8080"
    volumes:
      - ./reports/dast:/zap/wrk
    networks:
      - devsecops-network
    restart: unless-stopped

  # Trivy for Container Scanning
  trivy:
    image: aquasec/trivy:latest
    container_name: devsecops-trivy
    command: server --listen 0.0.0.0:8080
    ports:
      - "8091:8080"
    volumes:
      - trivy-cache:/root/.cache/trivy
    networks:
      - devsecops-network
    restart: unless-stopped

  # OPA Server for Policy Evaluation
  opa:
    image: openpolicyagent/opa:latest
    container_name: devsecops-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./config/opa:/policies
    networks:
      - devsecops-network
    restart: unless-stopped

  # Dashboard UI
  dashboard:
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile
    container_name: devsecops-dashboard
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    networks:
      - devsecops-network
    depends_on:
      - devsecops-guardian

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: devsecops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - devsecops-network
    restart: unless-stopped

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: devsecops-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - devsecops-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  devsecops-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  trivy-cache:
  prometheus-data:
  grafana-data:
